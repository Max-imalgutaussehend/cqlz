[package]
name = "killrvideo-cqlc"
version = "0.1.0"
edition = "2024"
publish = false
description = "cqlc example: the real KillrVideo 3.x schema, typed queries generated by cqlc, run against a live node"

[dependencies]
async-trait = "0.1"
scylla = "1.9"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
