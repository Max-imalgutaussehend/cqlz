[package]
name = "cqlz-benchmarks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Cross-project benchmarks for the cqlz family"

[dependencies]
cqlc-core = "1.0.1"
cql-ai-model = { git = "https://github.com/Max-imalgutaussehend/cql-ai" }
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
sqlparser = "0.63"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "frontend"
harness = false

[[bench]]
name = "inference"
harness = false

[[bin]]
name = "token_stats"
path = "src/bin/token_stats.rs"
